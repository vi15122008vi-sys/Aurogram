{% extends "base.html" %}{% block content %}
<div class="overflow-x-auto rounded-xl border border-white/10"><table class="w-full text-left text-sm"><thead class="bg-white/5 text-xs text-zinc-500"><tr><th class="p-3">Название</th><th class="p-3">Аккаунт</th><th class="p-3">Создана</th></tr></thead><tbody>{% for row in rows %}<tr class="border-t border-white/5"><td class="p-3">{{ row.name }}</td><td class="p-3 font-mono text-zinc-500">{{ row.account_id or 'Общая' }}</td><td class="p-3 text-zinc-500">{{ row.created_at }}</td></tr>{% else %}<tr><td colspan="3" class="p-4 text-zinc-500">Пользовательских тем нет</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
