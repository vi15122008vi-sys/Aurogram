{% extends "base.html" %}{% block content %}
<div class="overflow-x-auto rounded-xl border border-white/10"><table class="w-full text-left text-sm"><thead class="bg-white/5 text-xs text-zinc-500"><tr><th class="p-3">Канал ID</th><th class="p-3">Аккаунт</th><th class="p-3">Обновлено</th><th class="p-3">JSON</th></tr></thead><tbody>{% for row in rows %}<tr class="border-t border-white/5"><td class="p-3 font-mono">{{ row.channel_id }}</td><td class="p-3">{{ row.name or row.account_id[:8] }}</td><td class="p-3 text-zinc-500">{{ row.updated_at }}</td><td class="max-w-xl truncate p-3 font-mono text-xs text-zinc-500">{{ row.antispam_json }}</td></tr>{% else %}<tr><td colspan="4" class="p-4 text-zinc-500">Правила антиспама не настроены</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
