{% extends "base.html" %}{% block content %}
<div class="overflow-x-auto rounded-xl border border-white/10"><table class="w-full text-left text-sm"><thead class="bg-white/5 text-xs text-zinc-500"><tr><th class="p-3">Дата</th><th class="p-3">Аккаунт</th><th class="p-3">Чат</th><th class="p-3">Сообщение</th></tr></thead><tbody>{% for row in rows %}<tr class="border-t border-white/5"><td class="whitespace-nowrap p-3 text-zinc-500">{{ row.date or '—' }}</td><td class="p-3">{{ row.account_name or row.account_id[:8] }}</td><td class="p-3 font-mono">{{ row.chat_id }}</td><td class="max-w-2xl whitespace-pre-wrap p-3">{{ row.text or ('[' ~ (row.media_type or 'медиа') ~ ']') }}</td></tr>{% else %}<tr><td colspan="4" class="p-4 text-zinc-500">Кэшированных сообщений нет</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
