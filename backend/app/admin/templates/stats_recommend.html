{% if recommended.available %}
<div class="flex flex-wrap items-center gap-3 rounded-2xl border border-indigo-400/25 bg-indigo-500/10 px-3.5 py-3">
  <span class="grid size-9 shrink-0 place-items-center rounded-full bg-indigo-500/20 text-indigo-200">
    <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
  </span>
  <span class="min-w-0 flex-1">
    <span class="block text-[11px] uppercase tracking-[0.14em] text-indigo-300/80">Рекомендуемое окно</span>
    <span class="block font-mono text-lg leading-tight text-white">{{ recommended.label }}</span>
    <span class="mt-0.5 block text-[11px] text-zinc-400">{{ recommended.share }}% активности канала · {{ recommended.count|num }} сообщений за 2 часа · всего {{ hourly_total|num }} в кэше</span>
  </span>
</div>
{% else %}
<p class="rounded-2xl border border-white/[0.06] bg-white/[0.02] px-3.5 py-3 text-sm text-zinc-400">Пока нет данных: нужно накопить историю сообщений в кэше.</p>
{% endif %}
