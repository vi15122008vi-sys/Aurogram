{% extends "base.html" %}{% block content %}
<div class="overflow-x-auto rounded-xl border border-white/10"><table class="w-full text-left text-sm"><thead class="bg-white/5 text-xs text-zinc-500"><tr><th class="p-3">Bot ID</th><th class="p-3">Имя</th><th class="p-3">Username</th><th class="p-3">Webhook</th><th class="p-3">Аккаунт</th></tr></thead><tbody>{% for row in rows %}<tr class="border-t border-white/5"><td class="p-3 font-mono">{{ row.id }}</td><td class="p-3">{{ row.name }}</td><td class="p-3">@{{ row.username }}</td><td class="p-3">{{ 'Настроен' if row.webhook_url else 'Не настроен' }}</td><td class="p-3 font-mono text-zinc-500">{{ row.account_id[:8] }}</td></tr>{% else %}<tr><td colspan="5" class="p-4 text-zinc-500">Боты не подключены</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
