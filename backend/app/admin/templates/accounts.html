{% extends "base.html" %}{% block content %}
<div class="overflow-x-auto rounded-xl border border-white/10"><table class="w-full text-left text-sm"><thead class="bg-white/5 text-xs text-zinc-500"><tr><th class="p-3">Имя</th><th class="p-3">Телефон</th><th class="p-3">Username</th><th class="p-3">Статус</th><th class="p-3">Создан</th></tr></thead><tbody>{% for row in rows %}<tr class="border-t border-white/5"><td class="p-3">{{ row.name or '—' }}</td><td class="p-3 font-mono">{{ row.phone }}</td><td class="p-3">{{ row.username or '—' }}</td><td class="p-3">{{ row.auth_state }}</td><td class="p-3 text-zinc-500">{{ row.created_at }}</td></tr>{% else %}<tr><td colspan="5" class="p-4 text-zinc-500">Нет аккаунтов</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
