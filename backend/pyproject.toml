[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurogram-backend"
version = "0.1.0"
description = "Backend service for Aurogram"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "telethon>=1.38,<2.0",
    "aiosqlite>=0.21,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "itsdangerous>=2.2,<3.0",
    "cryptography>=44,<46",
    "httpx>=0.28,<1.0",
    "pywebpush>=2.0,<3.0",
    "markdown-it-py>=3,<4",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100