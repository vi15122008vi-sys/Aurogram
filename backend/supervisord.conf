[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:aurogram-api]
directory=/app
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true